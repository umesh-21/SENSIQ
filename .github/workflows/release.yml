# Builds the Windows setup file and publishes it as a GitHub Release when a version tag
# (v1.2.0, v1.3.0, ...) is pushed. Installed copies of SENSIQ find the new release,
# show its notes (from CHANGELOG.md) and offer to update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $v = (Select-String -Path sensiq/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG doesn't match __version__ $v (run tools/release.ps1)" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app and setup file
        shell: pwsh
        run: ./build.ps1 -SkipTests -Python (Join-Path $env:pythonLocation "python.exe")

      - name: Unit tests (informational; some need Windows OCR, missing on servers)
        shell: pwsh
        continue-on-error: true
        run: .venv\Scripts\python.exe -m pytest -q tests

      - name: Release notes and checksum
        shell: pwsh
        run: |
          $setup = "dist/installer/SENSIQ-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "setup file missing: $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  SENSIQ-Setup-$env:VERSION.exe" | Out-File "$setup.sha256" -Encoding ascii -NoNewline
          # the same file under the old name, so PII Guard 1.2/1.3 (before the rename) find this update
          $legacy = "dist/installer/PIIGuard-Setup-$env:VERSION.exe"
          Copy-Item $setup $legacy -Force
          "$hash  PIIGuard-Setup-$env:VERSION.exe" | Out-File "$legacy.sha256" -Encoding ascii -NoNewline
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n---`n**Install:** download ``SENSIQ-Setup-$env:VERSION.exe`` below and run it (Windows 10/11, 64-bit, no admin rights). Already installed? SENSIQ offers this update by itself.`n`nSHA-256: ``$hash``"
          $notes | Out-File release-notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "dist/installer/SENSIQ-Setup-$env:VERSION.exe"
          $legacy = "dist/installer/PIIGuard-Setup-$env:VERSION.exe"
          $files = @($setup, "$setup.sha256", $legacy, "$legacy.sha256")
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --notes-file release-notes.md
          } else {
            gh release create $env:TAG @files --title "SENSIQ $env:VERSION" --notes-file release-notes.md
          }

  # ---- Linux (Ubuntu 22.04 - 24.04): sensiq_X.Y.Z_amd64.deb ------------------------------------
  # Built on 22.04 so the package's libraries work on 22.04 and 24.04. Runs next to the Windows
  # build; "publish-linux" adds the .deb to the release once the Windows job has created it.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the tag matches the app version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sensiq/__init__.py)
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG doesn't match __version__ $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-dev python3-tk python3-gi \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-atspi-2.0 at-spi2-core \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin xvfb xclip libnotify-bin dbus-x11 fonts-liberation

      - name: Build app and .deb
        run: ./build_linux.sh --skip-tests

      - name: Unit tests (virtual display)
        run: xvfb-run -a .venv/bin/python -m pytest -q tests

      - name: Install, run and remove the .deb
        run: |
          deb="dist/sensiq_${VERSION}_amd64.deb"
          sudo apt-get install -y "./$deb"
          sensiq --version
          xvfb-run -a sensiq --selftest --no-open
          sudo apt-get remove -y sensiq
          test ! -e /opt/sensiq/sensiq

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            dist/sensiq_*_amd64.deb
            dist/sensiq_*_amd64.deb.sha256
          retention-days: 7

  linux-24:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Install, upgrade over itself, run and remove on Ubuntu 24.04
        run: |
          sudo apt-get update
          deb=$(ls dist/sensiq_*_amd64.deb)
          (cd dist && sha256sum -c "$(basename "$deb").sha256")
          sudo apt-get install -y "./$deb" xvfb
          sensiq --version
          xvfb-run -a sensiq --selftest --no-open
          sudo apt-get install -y --reinstall "./$deb"
          sensiq --version
          sudo apt-get remove -y sensiq
          test ! -e /opt/sensiq/sensiq

  publish-linux:
    needs: [build, linux, linux-24]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Add the .deb to the release
        run: |
          deb=$(ls dist/sensiq_*_amd64.deb)
          name=$(basename "$deb")
          gh release upload "$TAG" "$deb" "$deb.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json body -q .body --repo "$GITHUB_REPOSITORY" > notes.md
          if ! grep -q "Linux (Ubuntu" notes.md; then
            hash=$(cut -d' ' -f1 "$deb.sha256")
            printf '\n\n**Linux (Ubuntu 22.04 / 24.04, 64-bit):** download `%s` below and run `sudo apt install ./%s`. Already installed? SENSIQ offers this update by itself.\n\nSHA-256 (Linux): `%s`\n' \
              "$name" "$name" "$hash" >> notes.md
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
